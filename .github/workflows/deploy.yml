name: Build and deploy

# Every push to main is checked, built and published to GitHub Pages (https://mahamodul.no).
# Pull requests run the same checks without deploying.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://mahamodul.no
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/CNAME
          test -f out/sitemap.xml
          for slug in $(ls out/projects); do test -f "out/projects/$slug/index.html"; done
          echo "Pages: $(find out -name index.html | wc -l)"

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
